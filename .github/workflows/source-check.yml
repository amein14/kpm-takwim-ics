name: Check KPM sources

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/sources.json"
      - "data/source-manifest.json"
      - "data/events.json"
      - "data/staging-events.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/source-check.yml"

permissions:
  contents: read

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Discover KPM PDFs
        run: python -m scripts.discover --output "$RUNNER_TEMP/discovered-documents.json"

      - name: Download PDFs and update manifest
        run: >-
          python -m scripts.download
          --input "$RUNNER_TEMP/discovered-documents.json"
          --manifest data/source-manifest.json
          --download-dir "$RUNNER_TEMP/kpm-pdfs"

      - name: Extract Phase 2 staging data
        run: >-
          python -m scripts.extract
          --manifest data/source-manifest.json
          --pdf-dir "$RUNNER_TEMP/kpm-pdfs"
          --output "$RUNNER_TEMP/staging-events.json"

      - name: Save source manifest
        uses: actions/upload-artifact@v4
        with:
          name: kpm-source-manifest
          path: data/source-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Save unvalidated staging data
        uses: actions/upload-artifact@v4
        with:
          name: kpm-staged-events
          path: ${{ runner.temp }}/staging-events.json
          if-no-files-found: error
          retention-days: 30

      - name: Check published data against current KPM source
        run: >-
          python -m scripts.validate
          --staging "$RUNNER_TEMP/staging-events.json"
          --manifest data/source-manifest.json
          --pdf-dir "$RUNNER_TEMP/kpm-pdfs"
          --check-only
